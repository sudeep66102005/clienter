# No paid resources: Render Free web service + external Neon Free Postgres.
# DATABASE_URL is supplied securely from Neon; never commit its value.
services:
  - type: web
    name: clienter-app
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
