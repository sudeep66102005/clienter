# Free-tier default. This workspace currently has no free database slot.
# After explicit cost approval, change database plan to 0.1c-256mb.
# At 1 GB: about $6.30/month before tax/additional usage (2026-10-09).
services:
  - type: web
    name: clienter-app
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: clienter-db
          property: connectionString

databases:
  - name: clienter-db
    region: singapore
    plan: free
    diskSizeGB: 1
    postgresMajorVersion: "16"
    databaseName: clienter
    user: clienter
    ipAllowList: []
